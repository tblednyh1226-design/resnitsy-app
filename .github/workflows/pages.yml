name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build site
        run: |
          mkdir -p _site
          cat buildparts/01.txt buildparts/02.txt buildparts/03.txt buildparts/04.txt buildparts/05.txt buildparts/06.txt > _site/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html'); text=p.read_text()
          bad=["document.getElementById('weekTab').addEventListener('click'","document.getElementById('dayTab').addEventListener('click'","document.getElementById('prev').addEventListener('click'","document.getElementById('next').addEventListener('click'","document.getElementById('todayBtn').addEventListener('click'"]
          text='\n'.join(line for line in text.splitlines() if not any(x in line for x in bad))
          head='''<link rel="stylesheet" href="mobile-fix.css?v=3"><link rel="stylesheet" href="app-v4.css?v=7"><link rel="stylesheet" href="dayoff.css?v=5"><style>.notify-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.notify-row span{display:flex;flex-direction:column}.notify-row small{color:var(--muted);font-size:10px}.notify-section{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.notify-status{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafafa}#week .plus,#week .dayoff-mini{display:none!important}</style>'''
          body='''<script src="app-v4.js?v=8"></script><script src="edit-save-fix.js?v=2"></script><script src="waitlist-client.js?v=3"></script><script src="home-waitlist.js?v=4"></script><script src="dayoff.js?v=7"></script><script src="notifications.js?v=1"></script><script src="clients-refresh-fix.js?v=1"></script><script src="clients-waitlist-badge.js?v=1"></script><script src="calendar-nav-fix.js?v=3"></script><script src="day-header-stable.js?v=1"></script><script src="breaks.js?v=3"></script><script src="day-slot-actions.js?v=2"></script><script src="worktime.js?v=1"></script><script src="windows.js?v=2"></script><script src="calendar-unread.js?v=1"></script><script src="appointment-notifications.js?v=1"></script><script src="settings-sections.js?v=1"></script>'''
          text=text.replace('</head>',head+'</head>').replace('</body>',body+'</body>'); p.write_text(text)
          PY
          cp mobile-fix.css app-v4.css dayoff.css app-v4.js edit-save-fix.js waitlist-client.js home-waitlist.js dayoff.js notifications.js clients-refresh-fix.js clients-waitlist-badge.js calendar-nav-fix.js day-header-stable.js breaks.js day-slot-actions.js worktime.js windows.js calendar-unread.js appointment-notifications.js settings-sections.js booking.html _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
