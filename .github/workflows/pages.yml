name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build site
        run: |
          mkdir -p _site
          cat buildparts/01.txt buildparts/02.txt buildparts/03.txt buildparts/04.txt buildparts/05.txt buildparts/06.txt > _site/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          text=p.read_text()
          bad=[
            "document.getElementById('weekTab').addEventListener('click'",
            "document.getElementById('dayTab').addEventListener('click'",
            "document.getElementById('prev').addEventListener('click'",
            "document.getElementById('next').addEventListener('click'",
            "document.getElementById('todayBtn').addEventListener('click'",
          ]
          lines=text.splitlines()
          p.write_text('\n'.join(line for line in lines if not any(x in line for x in bad)))
          PY
          sed -i 's#</head>#<link rel="stylesheet" href="mobile-fix.css?v=3"><link rel="stylesheet" href="app-v4.css?v=4"><link rel="stylesheet" href="dayoff.css?v=2"><style>.notify-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.notify-row span{display:flex;flex-direction:column}.notify-row small{color:var(--muted);font-size:10px}.notify-section{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.notify-status{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafafa}</style></head>#' _site/index.html
          sed -i 's#</body>#<script src="app-v4.js?v=6"></script><script src="edit-save-fix.js?v=2"></script><script src="waitlist-client.js?v=1"></script><script src="home-waitlist.js?v=1"></script><script src="dayoff.js?v=3"></script><script src="notifications.js?v=1"></script></body>#' _site/index.html
          cp mobile-fix.css _site/mobile-fix.css
          cp app-v4.css _site/app-v4.css
          cp dayoff.css _site/dayoff.css
          cp app-v4.js _site/app-v4.js
          cp edit-save-fix.js _site/edit-save-fix.js
          cp waitlist-client.js _site/waitlist-client.js
          cp home-waitlist.js _site/home-waitlist.js
          cp dayoff.js _site/dayoff.js
          cp notifications.js _site/notifications.js
          cp booking.html _site/booking.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
