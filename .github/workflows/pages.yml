name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate source JavaScript
        run: |
          node --check app-v4.js
          node --check slotelly-runtime.js
          node --check slotelly-app.js
          node --check settings-sections.js
          node --check waitlist-client.js
          node --check home-waitlist.js
          node --check dayoff.js
          node --check notifications.js
          node --check breaks.js
          node --check worktime.js
          node --check waitlist-overview-stable.js
          node --check pwa-register.js
          node --check sw.js
      - name: Build site
        run: |
          mkdir -p _site
          cat buildparts/01.txt buildparts/02.txt buildparts/03.txt buildparts/04.txt buildparts/05.txt buildparts/06.txt > _site/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html'); text=p.read_text()
          bad=["document.getElementById('weekTab').addEventListener('click'","document.getElementById('dayTab').addEventListener('click'","document.getElementById('prev').addEventListener('click'","document.getElementById('next').addEventListener('click'","document.getElementById('todayBtn').addEventListener('click'"]
          text='\n'.join(line for line in text.splitlines() if not any(x in line for x in bad))
          text=text.replace("init().catch(e=>alert(e.message));","window.slotellyLegacyInit=init;")
          head='''<link rel="manifest" href="manifest.webmanifest?v=8"><meta name="theme-color" content="#8f4f68"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Slotelly"><link rel="icon" href="app-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="app-icon.svg"><link rel="stylesheet" href="mobile-fix.css?v=3"><link rel="stylesheet" href="app-v4.css?v=7"><link rel="stylesheet" href="dayoff.css?v=5"><style>.notify-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.notify-row span{display:flex;flex-direction:column}.notify-row small{color:var(--muted);font-size:10px}.notify-section{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}#week .plus,#week .dayoff-mini{display:none!important}.appt.pending,.day-appt.pending{opacity:.72}.appt.pending:after,.day-appt.pending:after{content:' •';font-weight:700}</style>'''
          body='''<script src="app-v4.js?v=8"></script><script src="slotelly-runtime.js?v=2"></script><script src="waitlist-client.js?v=4"></script><script src="telegram-client-link.js?v=1"></script><script src="home-waitlist.js?v=5"></script><script src="waitlist-smart-display.js?v=1"></script><script src="waitlist-suggestions.js?v=1"></script><script src="waitlist-card-history.js?v=2"></script><script src="dayoff.js?v=10"></script><script src="notifications.js?v=8"></script><script src="home-notifications.js?v=1"></script><script src="telegram-webhook-ui.js?v=2"></script><script src="clients-waitlist-badge.js?v=2"></script><script src="breaks.js?v=4"></script><script src="worktime.js?v=8"></script><script src="dayoff-workday-override.js?v=3"></script><script src="windows.js?v=2"></script><script src="calendar-unread.js?v=1"></script><script src="appointment-notifications.js?v=2"></script><script src="settings-sections.js?v=7"></script><script src="waitlist-overview-stable.js?v=3"></script><script src="slotelly-app.js?v=1"></script><script src="pwa-register.js?v=19"></script>'''
          text=text.replace('</head>',head+'</head>').replace('</body>',body+'</body>'); p.write_text(text)
          PY
          cp mobile-fix.css app-v4.css dayoff.css app-v4.js slotelly-runtime.js slotelly-app.js waitlist-client.js telegram-client-link.js home-waitlist.js waitlist-smart-display.js waitlist-suggestions.js waitlist-card-history.js dayoff.js dayoff-workday-override.js notifications.js home-notifications.js telegram-webhook-ui.js clients-waitlist-badge.js breaks.js worktime.js windows.js calendar-unread.js appointment-notifications.js settings-sections.js waitlist-overview-stable.js booking.html booking-identify.js booking-online-notify.js manifest.webmanifest app-icon.svg sw.js pwa-register.js _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/home-waitlist.js'); t=p.read_text(); old="window.openWaitlistOverview=openWaitlistOverview;window.refreshWaitlistCounter=refreshCounter;refreshCounter();"; new="""window.openWaitlistOverview=openWaitlistOverview;window.refreshWaitlistCounter=refreshCounter;const applySnap=()=>{const n=Number(window.SLOTELLY_SNAPSHOT?.waitlist_count||0),badge=document.getElementById('homeWaitlistCount'),sub=document.getElementById('homeWaitlistSub');if(badge){badge.textContent=n;badge.hidden=!n;badge.classList.remove('is-new')}if(sub)sub.textContent=n?`Активных запросов: ${n}`:'Сейчас никто не ждёт окошко'};window.addEventListener('slotelly:state',applySnap);applySnap();"""; t=t.replace(old,new); p.write_text(t)
          for name in ['waitlist-client.js','dayoff.js','breaks.js','notifications.js']:
            p=Path('_site')/name; t=p.read_text(); t=t.replace("'Content-Type':'application/json'","'Content-Type':'text/plain;charset=UTF-8'"); p.write_text(t)
          p=Path('_site/booking.html'); text=p.read_text(); text=text.replace('</body>','<script src="booking-online-notify.js?v=2"></script><script src="booking-identify.js?v=4"></script></body>'); p.write_text(text)
          PY
          touch _site/.nojekyll
      - name: Validate production build
        run: |
          node --check _site/slotelly-runtime.js
          node --check _site/slotelly-app.js
          node --check _site/settings-sections.js
          node --check _site/waitlist-overview-stable.js
          node --check _site/notifications.js
          node --check _site/pwa-register.js
          node --check _site/sw.js
          grep -q 'slotelly-runtime.js?v=2' _site/index.html
          grep -q 'settings-sections.js?v=7' _site/index.html
          grep -q 'pwa-register.js?v=19' _site/index.html
          ! grep -q 'fast-network.js' _site/index.html
          ! grep -q 'edit-save-fix.js' _site/index.html
          ! grep -q 'calendar-core-stable.js' _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
