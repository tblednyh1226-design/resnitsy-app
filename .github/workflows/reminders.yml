name: Telegram reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder scan
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            https://acukaqoguzkrphauovhk.supabase.co/functions/v1/resnitsy-reminders
