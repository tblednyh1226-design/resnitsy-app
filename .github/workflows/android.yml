name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply work build changes
        working-directory: android
        run: python3 patch_work_build.py
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK identity
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='ru.slotelly.app.work060' versionCode='1' versionName='0.6.0-work'" /tmp/apk-badging.txt
          grep -F "application-label:'Slotelly 0.6 WORK'" /tmp/apk-badging.txt
          grep -F "launchable-activity: name='ru.slotelly.app.NativeMainActivity'" /tmp/apk-badging.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slotelly-0.6-work-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
