<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="cache-control" content="no-store"><title>Запись онлайн</title><style>:root{--bg:#f8f5f7;--card:#fff;--line:#ded6dc;--text:#2d2730;--muted:#837a82;--accent:#c7aabd;--soft:#efe5eb}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui;color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}.app{height:100%;max-width:560px;margin:auto;padding:14px;display:flex;flex-direction:column}.head{flex:0 0 auto}.title{font-size:28px;font-weight:800}.sub{font-size:13px;color:var(--muted)}.step{display:none;flex:1;min-height:0;overflow:hidden}.step.on{display:flex;flex-direction:column}.scroll{overflow:auto;min-height:0;padding:10px 0}.list{display:grid;gap:8px}.card{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px}.card.on{background:var(--soft);border-color:var(--accent)}.card strong{display:block;font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto;padding-top:8px}.actions.one{grid-template-columns:1fr}.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:54px;padding:10px;font-weight:700}.primary{background:var(--soft);border-color:var(--accent)}.primary:disabled{opacity:.45}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;font-size:16px}.summary{background:white;border:1px solid var(--line);border-radius:13px;padding:11px}.error{padding:10px;border-radius:10px;background:#f7e1e1;color:#8d3434;margin-top:8px}.loading{padding:12px 0;color:var(--muted)}.slot-days{display:grid;gap:9px;margin-top:8px}.slot-day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px}.slot-date{font-weight:800;font-size:15px;margin-bottom:8px;text-transform:capitalize}.slot-times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.slot-time{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:42px;padding:8px 4px;font-weight:750;font-size:15px;text-align:center}.slot-time:active,.slot-time:hover{background:var(--soft);border-color:var(--accent)}@media(max-width:390px){.slot-times{grid-template-columns:repeat(3,minmax(0,1fr))}.slot-time{font-size:14px}}@media(max-width:330px){.slot-times{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div class="app"><div class="head"><div class="title">Запись онлайн</div><div class="sub">Выберите услугу и удобное время</div></div><section id="s1" class="step on"><div class="scroll"><div id="priceState" class="loading">Загрузка прайса…</div><div id="serviceList" class="list"></div></div><div class="actions one"><button id="toPeriods" class="btn primary" disabled>Далее</button></div></section><section id="s2" class="step"><div class="scroll"><h3>Когда посмотреть окошки?</h3><div class="list"><button class="card period" data-p="cw">Текущая неделя</button><button class="card period" data-p="nw">Следующая неделя</button><button class="card period" data-p="cm">Текущий месяц</button><button class="card period" data-p="nm">Следующий месяц</button></div></div><div class="actions"><button id="back1" class="btn">Назад</button><button id="showSlots" class="btn primary" disabled>Показать время</button></div></section><section id="s3" class="step"><div class="scroll"><h3>Свободные окошки</h3><div id="slotState" class="sub"></div><div id="slotList" class="slot-days"></div></div><div class="actions"><button id="back2" class="btn">Назад</button><button id="noTime" class="btn">Нет удобного</button></div></section><section id="s4" class="step"><div class="scroll"><div id="summary" class="summary"></div><div class="field"><label>Имя</label><input id="clientName" autocomplete="name"></div><div class="field"><label>Телефон</label><input id="clientPhone" type="tel" autocomplete="tel"></div><div class="field"><label>Мессенджер</label><select id="messenger"><option>Telegram</option><option>WhatsApp</option><option>VK</option><option>MAX</option></select></div></div><div class="actions"><button id="back3" class="btn">Назад</button><button id="confirm" class="btn primary">Подтвердить</button></div></section><section id="s5" class="step"><div class="scroll"><h3>Не нашли удобного времени?</h3><div class="field"><label>Какое время вам подходит?</label><textarea id="wish" rows="4" placeholder="Например: будни после 18:00"></textarea></div><div class="field"><label>Имя</label><input id="wishName"></div><div class="field"><label>Телефон</label><input id="wishPhone" type="tel"></div><div class="field"><label>Мессенджер</label><select id="wishMessenger"><option>Telegram</option><option>WhatsApp</option><option>VK</option><option>MAX</option></select></div></div><div class="actions"><button id="back4" class="btn">Назад</button><button id="sendWish" class="btn primary">Отправить</button></div></section><section id="done" class="step"><div class="scroll"><h2>Готово ✓</h2><p id="doneText"></p></div><div class="actions one"><button id="restart" class="btn primary">Новая запись</button></div></section></div><script>const API='https://acukaqoguzkrphauovhk.supabase.co/functions/v1/resnitsy-booking';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let catalog=[],selected=new Set(),period='',range=null,picked=null;async function api(action,data={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...data}),signal:c.signal,cache:'no-store'});const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{throw Error('Сервер вернул неверный ответ')}if(!r.ok||!j.ok)throw Error(j.error||'Ошибка');return j}finally{clearTimeout(t)}}function step(id){$$('.step').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}function pad(n){return String(n).padStart(2,'0')}function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}function makeRange(p){const n=new Date();let a,b;if(p==='cw'){a=monday(n);b=new Date(a);b.setDate(b.getDate()+7)}if(p==='nw'){a=monday(n);a.setDate(a.getDate()+7);b=new Date(a);b.setDate(b.getDate()+7)}if(p==='cm'){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,1)}if(p==='nm'){a=new Date(n.getFullYear(),n.getMonth()+1,1);b=new Date(n.getFullYear(),n.getMonth()+2,1)}return{from:ds(a),to:ds(b)}}function renderServices(){const box=$('#serviceList');box.innerHTML='';catalog.forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML='<strong>'+s.name+'</strong><div class="meta">'+Number(s.base_price).toLocaleString('ru-RU')+' ₽ · '+Math.round((Number(s.duration_minutes||0)+Number(s.buffer_minutes||0))/30)/2+' ч</div>';b.onclick=()=>{selected.has(s.id)?selected.delete(s.id):selected.add(s.id);b.classList.toggle('on',selected.has(s.id));$('#toPeriods').disabled=!selected.size};box.appendChild(b)})}function renderSlots(slots){const host=$('#slotList');host.innerHTML='';const groups=new Map();for(const sl of slots){const dt=new Date(sl.start),key=dt.toLocaleDateString('sv-SE',{timeZone:'Europe/Moscow'});if(!groups.has(key))groups.set(key,[]);groups.get(key).push(sl)}for(const [key,list] of groups){list.sort((a,b)=>new Date(a.start)-new Date(b.start));const first=new Date(list[0].start),wrap=document.createElement('div');wrap.className='slot-day';const dateLabel=first.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long',timeZone:'Europe/Moscow'}).replace('.','');wrap.innerHTML='<div class="slot-date">'+dateLabel+'</div><div class="slot-times"></div>';const times=wrap.querySelector('.slot-times');for(const sl of list){const dt=new Date(sl.start),b=document.createElement('button');b.className='slot-time';b.textContent=dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'});b.onclick=()=>{picked=sl;$('#summary').innerHTML='<strong>'+dt.toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'})+'</strong><div class="meta">'+catalog.filter(s=>selected.has(s.id)).map(s=>s.name).join(' + ')+'</div>';step('s4')};times.appendChild(b)}host.appendChild(wrap)}}async function boot(){try{const d=await api('bootstrap');catalog=d.services||[];$('#priceState').style.display='none';if(!catalog.length){$('#priceState').style.display='block';$('#priceState').textContent='Нет услуг для онлайн-записи'}else renderServices()}catch(e){$('#priceState').className='error';$('#priceState').textContent='Не удалось загрузить прайс: '+(e.name==='AbortError'?'превышено время ожидания':e.message)}}boot();$('#toPeriods').onclick=()=>step('s2');$$('.period').forEach(b=>b.onclick=()=>{$$('.period').forEach(x=>x.classList.remove('on'));b.classList.add('on');period=b.dataset.p;$('#showSlots').disabled=false});$('#back1').onclick=()=>step('s1');$('#showSlots').onclick=async()=>{range=makeRange(period);$('#slotList').innerHTML='';$('#slotState').textContent='Загрузка окошек…';step('s3');try{const d=await api('slots',{serviceIds:[...selected],fromDate:range.from,toDate:range.to});$('#slotState').textContent=d.slots.length?'Выберите удобное время':'В этом периоде свободных окошек нет';renderSlots(d.slots||[])}catch(e){$('#slotState').innerHTML='<div class="error">'+e.message+'</div>'}};$('#back2').onclick=()=>step('s2');$('#noTime').onclick=()=>step('s5');$('#back3').onclick=()=>step('s3');$('#clientPhone').onblur=async()=>{try{const d=await api('clientPrefs',{phone:$('#clientPhone').value});if(d.client){if(!$('#clientName').value)$('#clientName').value=d.client.display_name||'';if(d.client.messenger)$('#messenger').value=d.client.messenger}}catch{}};$('#confirm').onclick=async()=>{if(!picked)return;const b=$('#confirm');b.disabled=true;b.textContent='Записываю…';try{await api('book',{serviceIds:[...selected],fromDate:range.from,toDate:range.to,start:picked.start,name:$('#clientName').value,phone:$('#clientPhone').value,messenger:$('#messenger').value});$('#doneText').textContent='Запись создана. Мастер увидит её в календаре.';step('done')}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='Подтвердить'}};$('#back4').onclick=()=>step('s3');$('#sendWish').onclick=async()=>{if(!$('#wish').value.trim())return alert('Напишите, какое время подходит');try{await api('waitlist',{desiredText:$('#wish').value,name:$('#wishName').value,phone:$('#wishPhone').value,messenger:$('#wishMessenger').value,telegramBot:$('#wishMessenger').value==='Telegram'});$('#doneText').textContent='Пожелания сохранены в ловце окошек.';step('done')}catch(e){alert(e.message)}};$('#restart').onclick=()=>location.reload();</script></body></html>
