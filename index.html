<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ресницы — мастер</title><style>:root{--bg:#f7f5f7;--card:#fff;--line:#ded6dc;--text:#2d2730;--muted:#837a82;--accent:#c7aabd;--soft:#efe5eb;--new:#ece9eb;--mc:#dce8f5;--cc:#dcebdc;--paid:#cae5cf;--unpaid:#f1e1bd}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui;color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}.app{height:100%;max-width:900px;margin:auto;display:flex;flex-direction:column}.main{flex:1;min-height:0;position:relative}.screen{display:none;height:100%;padding:10px;overflow:hidden}.screen.on{display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.title{font-size:22px;font-weight:780}.sub{font-size:11px;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;min-height:42px;padding:8px 10px}.primary{background:var(--soft);border-color:var(--accent);font-weight:700}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;align-content:start;padding-top:8px}.homebtn{min-height:90px;text-align:left;padding:14px;border:1px solid var(--line);background:#fff;border-radius:16px}.homebtn strong{display:block;font-size:18px;margin-bottom:6px}.homebtn span{font-size:11px;color:var(--muted)}.navrow{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center;margin-bottom:6px}.period{text-align:center;font-weight:700}.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.tabs button{border:0;background:#fff;padding:8px 11px}.tabs .on{background:var(--soft);font-weight:700}.week{display:grid;grid-template-columns:repeat(7,1fr);flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.day{position:relative;border-right:1px solid var(--line);min-width:0}.dh{height:36px;background:#f1edf0;border-bottom:1px solid var(--line);text-align:center;font-size:8px;padding:3px;position:relative}.dh strong{display:block;font-size:9px}.plus{position:absolute;right:2px;bottom:2px;width:20px;height:20px;padding:0;border:1px solid var(--line);background:#fff;border-radius:6px}.appt{position:absolute;left:2px;right:2px;border:1px solid var(--line);border-radius:5px;padding:2px;text-align:left;overflow:hidden;font-size:7px;z-index:4}.appt strong,.appt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.new{background:var(--new)}.master_confirmed{background:var(--mc)}.client_confirmed{background:var(--cc)}.completed_paid{background:var(--paid)}.completed_unpaid{background:var(--unpaid)}.free{position:absolute;left:2px;right:2px;height:15px;border:1px solid var(--accent);background:var(--soft);border-radius:4px;font-size:6px;z-index:2}.free.off{opacity:.3;background:#f1edf0;border-color:var(--line)}.dayview{display:none;flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}.dayview.on{display:block}.hourrow{height:calc(100% / 14);display:grid;grid-template-columns:46px 1fr;border-bottom:1px solid var(--line)}.hour{font-size:8px;color:var(--muted);text-align:center;padding-top:3px;border-right:1px solid var(--line)}.lane{position:relative}.half{position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--line)}.dfree{position:absolute;left:5px;width:105px;height:44%;font-size:7px;border:1px solid var(--line);border-radius:5px;background:#f1edf0}.dfree.on{background:var(--soft);border-color:var(--accent)}.dappt{position:absolute;left:52px;right:4px;border:1px solid var(--line);border-radius:6px;padding:4px;text-align:left;z-index:5;overflow:hidden}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.scroll{overflow:auto;min-height:0}.list{display:grid;gap:7px}.card{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;text-align:left}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;margin-bottom:8px}.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{font-size:23px;font-weight:780}.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#fff;padding:5px}.bottomnav button{border:0;background:transparent;padding:8px 2px;font-size:9px;color:var(--muted)}.bottomnav .active{font-weight:700;color:var(--text)}.overlay{display:none;position:absolute;inset:0;background:#0003;z-index:40;padding:8px;align-items:center;justify-content:center}.overlay.on{display:flex}.modal{width:100%;max-width:540px;max-height:97%;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;display:flex;flex-direction:column}.mh{display:flex;justify-content:space-between;gap:8px}.mb{overflow:auto;min-height:0}.mf{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.field{margin:7px 0}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:3px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:6px}</style></head><body><div class="app"><div class="main"><section id="home" class="screen on"><div class="top"><div><div class="title">Ресницы</div><div class="sub">Кабинет мастера</div></div><button class="btn" id="homeToday">Сегодня</button></div><div class="homegrid"><button class="homebtn" data-go="calendar"><strong>Календарь</strong><span>Неделя, день, записи и доступность</span></button><button class="homebtn" data-go="finance"><strong>Финансы</strong><span>Оплаты, выручка, средний чек</span></button><button class="homebtn" data-go="reports"><strong>Отчёты</strong><span>Записи и ловец окошек</span></button><button class="homebtn" data-go="clients"><strong>Клиенты</strong><span>Поиск, карточка и история</span></button><button class="homebtn" data-go="services"><strong>Услуги</strong><span>Цены и длительность</span></button><button class="homebtn" data-go="settings"><strong>Настройки</strong><span>Окошки и онлайн-запись</span></button></div></section><section id="calendar" class="screen"><div class="top"><div><div class="title">Календарь</div><div class="sub" id="calSub">Неделя целиком</div></div><div class="tabs"><button id="weekTab" class="on">Неделя</button><button id="dayTab">День</button></div></div><div class="navrow"><button class="btn" id="prev">‹</button><div class="period" id="period"></div><button class="btn" id="next">›</button></div><div id="week" class="week"></div><div id="dayview" class="dayview"></div><div class="actions"><button class="btn" id="windowsBtn">Окошки</button><button class="btn primary" id="newBtn">+ Запись</button><button class="btn" id="todayBtn">Сегодня</button></div></section><section id="clients" class="screen"><div class="top"><div class="title">Клиенты</div><button class="btn" id="addClientBtn">+ Клиент</button></div><input id="clientSearch" class="search" placeholder="Поиск по имени или телефону"><div id="clientList" class="scroll list"></div></section><section id="finance" class="screen"><div class="top"><div><div class="title">Финансы</div><div class="sub">По проведённым оплатам</div></div></div><div class="twocol"><div class="field"><label>С</label><input id="finFrom" type="date"></div><div class="field"><label>По</label><input id="finTo" type="date"></div></div><button id="finRun" class="btn primary">Обновить</button><div id="finBox" class="scroll" style="margin-top:8px"></div></section><section id="reports" class="screen"><div class="top"><div><div class="title">Отчёты</div><div class="sub">Записи и ловец окошек</div></div></div><div id="reportBox" class="scroll list"></div></section><section id="services" class="screen"><div class="top"><div class="title">Услуги</div></div><div id="serviceList" class="scroll list"></div></section><section id="settings" class="screen"><div class="top"><div><div class="title">Настройки</div><div class="sub">Онлайн-запись и расписание</div></div></div><div id="settingsBox" class="scroll"></div></section><div id="ov" class="overlay"><div class="modal"><div class="mh"><div><button id="mt" style="border:0;background:none;padding:0;font-weight:780;font-size:18px"></button><div id="ms" class="sub"></div></div><button class="btn" id="closeBtn">×</button></div><div id="mb" class="mb"></div><div id="mf" class="mf"></div></div></div></div><nav class="bottomnav"><button data-s="home" class="active">Главная</button><button data-s="calendar">Календарь</button><button data-s="clients">Клиенты</button><button data-s="finance">Финансы</button><button data-s="reports">Отчёты</button></nav></div><script>const BASE='https://acukaqoguzkrphauovhk.supabase.co',KEY='sb_publishable_2aKxmTx4WtnZglspnun9gA_goe71amD',EDGE=BASE+'/functions/v1/resnitsy-master';const PIN=sessionStorage.getItem('pin')||prompt('PIN мастера');if(PIN)sessionStorage.setItem('pin',PIN);const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let services=[],settings={},view='week',focus=today(),weekStart=monday(focus),lastCal=null;async function rpc(name,body={}){const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(body)});const t=await r.text();let j;try{j=t?JSON.parse(t):null}catch{j=t}if(!r.ok)throw Error(j?.message||j||'Ошибка');return j}async function edge(action,data={}){const r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,action,...data})});const j=await r.json();if(!j.ok)throw Error(j.error||'Ошибка');return j}function today(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Moscow'})}function D(s){return new Date(s+'T00:00:00+03:00')}function add(s,n){const d=D(s);d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE',{timeZone:'Europe/Moscow'})}function monday(s){const d=D(s),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d.toLocaleDateString('sv-SE',{timeZone:'Europe/Moscow'})}function ld(x){return new Date(x).toLocaleDateString('sv-SE',{timeZone:'Europe/Moscow'})}function hm(x){return new Date(x).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'})}function showScreen(id){qa('.screen').forEach(x=>x.classList.toggle('on',x.id===id));qa('.bottomnav button').forEach(x=>x.classList.toggle('active',x.dataset.s===id));if(id==='calendar')renderCal();if(id==='clients')q('#clientList').innerHTML='<div class="sub">Начните вводить имя или телефон</div>';if(id==='finance')runFinance();if(id==='reports')loadReports();if(id==='services')renderServices();if(id==='settings')renderSettings()}function modal(t,s,b,f=''){q('#mt').textContent=t;q('#ms').textContent=s||'';q('#mb').innerHTML=b;q('#mf').innerHTML=f;q('#ov').classList.add('on')}function closeModal(){q('#ov').classList.remove('on')}function topPx(min,h){return 36+(min-540)/840*(h-36)}async function init(){const b=await rpc('master_app_bootstrap',{p_pin:PIN});services=b.services||[];settings=b.settings||{};q('#finFrom').value=add(today(),-30);q('#finTo').value=today();renderServices();renderSettings()}async function renderCal(){q('#weekTab').classList.toggle('on',view==='week');q('#dayTab').classList.toggle('on',view==='day');q('#week').style.display=view==='week'?'grid':'none';q('#dayview').classList.toggle('on',view==='day');q('#calSub').textContent=view==='week'?'Неделя целиком':'День';if(view==='week')await renderWeek();else await renderDay()}async function renderWeek(){const from=D(weekStart).toISOString(),to=D(add(weekStart,7)).toISOString();lastCal=await rpc('master_app_calendar',{p_pin:PIN,p_from:from,p_to:to});q('#period').textContent=D(weekStart).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' — '+D(add(weekStart,6)).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});const week=q('#week');week.innerHTML='';for(let i=0;i<7;i++){const ds=add(weekStart,i),col=document.createElement('div');col.className='day';col.innerHTML='<div class="dh"><strong>'+D(ds).toLocaleDateString('ru-RU',{weekday:'short'}).replace('.','').toUpperCase()+'</strong>'+D(ds).getDate()+'<button class="plus">+</button></div>';col.querySelector('.dh').addEventListener('click',e=>{if(!e.target.classList.contains('plus')){focus=ds;view='day';renderCal()}});col.querySelector('.plus').addEventListener('click',e=>{e.stopPropagation();extraTime(ds)});const aps=lastCal.appointments.filter(a=>ld(a.starts_at)===ds&&a.status!=='cancelled');for(const a of aps){const st=hm(a.starts_at),m=+st.slice(0,2)*60+ +st.slice(3),dur=(new Date(a.ends_at)-new Date(a.starts_at))/60000,b=document.createElement('button');b.className='appt '+a.status;b.style.top=topPx(m,week.clientHeight)+'px';b.style.height=Math.max(22,dur/840*(week.clientHeight-36))+'px';b.innerHTML='<strong>'+st+' '+(a.client_name||'Клиент')+'</strong><small>'+a.services.map(s=>s.name).join(' + ')+'</small>';b.addEventListener('click',()=>showAppt(a));col.appendChild(b)}for(const t of ['10:00','13:00','16:00','19:00']){const st=new Date(ds+'T'+t+':00+03:00'),busy=aps.some(a=>st>=new Date(a.starts_at)&&st<new Date(a.ends_at)),o=lastCal.overrides.find(x=>new Date(x.slot_start).getTime()===st.getTime()),on=o?o.is_available:true;if(!busy){const m=+t.slice(0,2)*60+ +t.slice(3),b=document.createElement('button');b.className='free '+(on?'':'off');b.style.top=topPx(m,week.clientHeight)+'px';b.textContent=t;b.addEventListener('click',async()=>{await rpc('master_app_set_availability',{p_pin:PIN,p_slot:st.toISOString(),p_value:!on});renderWeek()});col.appendChild(b)}}week.appendChild(col)}}async function renderDay(){const z=await rpc('master_app_calendar',{p_pin:PIN,p_from:D(focus).toISOString(),p_to:D(add(focus,1)).toISOString()});q('#period').textContent=D(focus).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});const dv=q('#dayview');dv.innerHTML='';for(let h=9;h<23;h++){const row=document.createElement('div');row.className='hourrow';row.innerHTML='<div class="hour">'+String(h).padStart(2,'0')+':00</div><div class="lane"><div class="half"></div></div>';const lane=row.querySelector('.lane');for(const mm of [0,30]){const t=String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'),st=new Date(focus+'T'+t+':00+03:00'),o=z.overrides.find(x=>new Date(x.slot_start).getTime()===st.getTime()),def=['10:00','13:00','16:00','19:00'].includes(t),on=o?o.is_available:def,b=document.createElement('button');b.className='dfree '+(on?'on':'');b.style.top=mm===0?'2%':'52%';b.textContent=t+(on?' доступно':' закрыто');b.addEventListener('click',async e=>{e.stopPropagation();await rpc('master_app_set_availability',{p_pin:PIN,p_slot:st.toISOString(),p_value:!on});renderDay()});lane.appendChild(b)}dv.appendChild(row)}for(const a of z.appointments.filter(x=>x.status!=='cancelled')){const st=hm(a.starts_at),m=+st.slice(0,2)*60+ +st.slice(3),dur=(new Date(a.ends_at)-new Date(a.starts_at))/60000,b=document.createElement('button');b.className='dappt '+a.status;b.style.top=((m-540)/840*100)+'%';b.style.height=Math.max(3,dur/840*100)+'%';b.innerHTML='<strong>'+st+' · '+(a.client_name||'Клиент')+'</strong><small>'+a.services.map(s=>s.name).join(' + ')+'</small>';b.addEventListener('click',()=>showAppt(a));dv.appendChild(b)}}function showAppt(a){const total=a.services.reduce((n,s)=>n+Number(s.price||0),0),p=a.payments?.[0];modal(a.client_name||'Запись',ld(a.starts_at)+' · '+hm(a.starts_at),'<div class="card">'+a.services.map(s=>s.name+' — <b>'+Number(s.price).toLocaleString('ru-RU')+' ₽</b>').join('<br>')+'<hr>Итого <b>'+total.toLocaleString('ru-RU')+' ₽</b></div><div class="card">Комментарий: '+(a.master_comment||'—')+'</div><div class="card">Оплата: '+(p?Number(p.total).toLocaleString('ru-RU')+' ₽':'не проведена')+'</div>','<button class="btn primary" id="editA">Редактировать</button><button class="btn" id="payA">Оплатить</button><button class="btn" id="unpaidA">Без оплаты</button><button class="btn" id="cancelA">Отменить</button>');q('#editA').addEventListener('click',()=>form(a));q('#payA').addEventListener('click',()=>payment(a,total));q('#unpaidA').addEventListener('click',async()=>{await rpc('master_app_status',{p_pin:PIN,p_id:a.id,p_status:'completed_unpaid'});closeModal();renderCal()});q('#cancelA').addEventListener('click',async()=>{if(confirm('Отменить запись?')){await rpc('master_app_status',{p_pin:PIN,p_id:a.id,p_status:'cancelled'});closeModal();renderCal()}})}function form(a=null){let cid=a?.client_id||'',svc=a?.services?.[0]||null;modal(a?'Редактирование':'Новая запись','', '<div class="field"><label>Клиент</label><input id="clientQ" placeholder="Имя или телефон" value="'+(a?.client_name||'')+'"></div><div id="pickList" class="list"></div><div class="twocol"><div class="field"><label>Дата</label><input id="dateA" type="date" value="'+(a?ld(a.starts_at):focus)+'"></div><div class="field"><label>Время</label><input id="timeA" type="time" value="'+(a?hm(a.starts_at):'16:00')+'"></div></div><div class="field"><label>Услуга</label><select id="svcA">'+services.filter(s=>s.is_active).map(s=>'<option value="'+s.id+'" '+(svc?.service_id===s.id?'selected':'')+'>'+s.name+'</option>').join('')+'</select></div><div class="field"><label>Цена</label><input id="priceA" type="number" value="'+(svc?.price||services[0]?.base_price||0)+'"></div><div class="field"><label>Комментарий</label><textarea id="commentA">'+(a?.master_comment||'')+'</textarea></div>','<button class="btn primary" id="saveA">Сохранить</button><button class="btn" id="newClientA">+ Новый клиент</button>');q('#clientQ').addEventListener('input',async e=>{const v=e.target.value.trim();if(v.length<2){q('#pickList').innerHTML='';return}const z=await rpc('master_app_clients',{p_pin:PIN,p_q:v});q('#pickList').innerHTML=z.map(c=>'<button class="card pick" data-id="'+c lick',async()=>{const c=Number(q('#cash').value||0),d=Number(q('#card').value||0),o=Number(q('#other').value||0);if(c+d+o!==total)return alert('Разбивка должна быть '+total+' ₽');await rpc('master_app_payment',{p_pin:PIN,p_id:a.id,p_cash:c,p_card:d,p_other:o});closeModal();renderCal()})}async function runFinance(){if(!q('#finFrom').value||!q('#finTo').value)return;const z=await edge('report',{from:new Date(q('#finFrom').value+'T00:00:00+03:00').toISOString(),to:new Date(add(q('#finTo').value,1)+'T00:00:00+03:00').toISOString()}),rows=(z.rows||[]).filter(x=>x.status!=='cancelled'),paid=rows.filter(x=>x.status==='completed_paid'),money=paid.reduce((n,x)=>n+(x.payments?.[0]?Number(x.payments[0].total_amount):0),0);q('#finBox').innerHTML='<div class="metricgrid"><div class="card"><div class="metric">'+money.toLocaleString('ru-RU')+' ₽</div><div class="sub">выручка</div></div><div class="card"><div class="metric">'+rows.length+'</div><div class="sub">записей</div></div></div>'}async function loadReports(){const w=await edge('waitlist'),r=await edge('report',{from:new Date(add(today(),-30)+'T00:00:00+03:00').toISOString(),to:new Date(add(today(),1)+'T00:00:00+03:00').toISOString()});q('#reportBox').innerHTML='<div class="card"><b>Ловец окошек</b><div class="sub">Активных запросов: '+(w.rows?.length||0)+'</div></div><div class="card"><b>Записи за 30 дней</b><div class="sub">'+(r.rows?.length||0)+' записей</div></div>'}function renderServices(){q('#serviceList').innerHTML=services.map(s=>'<div class="card"><b>'+s.name+'</b><div class="sub">'+Number(s.base_price).toLocaleString('ru-RU')+' ₽ · '+s.duration_minutes+' мин</div></div>').join('')}function renderSettings(){const sl=settings.slot_types||{};q('#settingsBox').innerHTML='<div class="card"><b>Онлайн-запись</b><div class="sub">'+(settings.online_booking?.enabled===false?'Выключена':'Включена')+'</div></div><div class="card"><b>Базовые окна</b><div class="sub">'+(sl.normal||['10:00','13:00','16:00','19:00']).join(', ')+'
